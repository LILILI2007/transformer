name: 问题反馈
description: 报告导入、翻译、更新、导出或安装问题
body:
  - type: markdown
    attributes:
      value: 请勿上传 API 密钥、完整私有 mod 或个人存档。
  - type: input
    id: versions
    attributes:
      label: 工具、Windows、游戏、SMAPI 和 mod 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果、错误提示和最小脱敏文本
    validations:
      required: true
  - type: checkboxes
    id: private
    attributes:
      label: 提交前检查
      options:
        - label: 已移除密钥和私人资料，素材允许公开
          required: true
