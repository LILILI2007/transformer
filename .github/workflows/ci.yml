name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -m modlingo --smoke
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./scripts/build_windows.ps1 -PythonPath (Get-Command python).Source
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ModLingo-Windows-x64
          path: release/ModLingo-Windows-x64.zip
